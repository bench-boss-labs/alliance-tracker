<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alliance Tracker" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Unofficial standings, scores and schedules for ALLIANCE Hockey rep divisions." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Alliance Tracker</title>
    <script>
      // Moving from the old address: the old site forwards here with the phone's
      // saved teams and settings in the link (#/import?d=...). Merge them in, then
      // carry on to the screen the person was opening. The link part after # never
      // leaves the phone.
      try {
        var h = location.hash, m = /^#\/import\?d=([^&]*)(?:&to=(.*))?$/.exec(h);
        if (m) {
          var d = JSON.parse(decodeURIComponent(m[1]) || '{}');
          var ok = function (x) { return typeof x === 'string' && /^\d{1,6}:[a-z0-9-]{1,80}$/.test(x); };
          if (Array.isArray(d.saved)) {
            var have = []; try { have = JSON.parse(localStorage.getItem('at.saved')) || []; } catch (e) {}
            var all = have.concat(d.saved.filter(ok)).filter(function (x, i, a) { return a.indexOf(x) === i; }).slice(0, 50);
            localStorage.setItem('at.saved', JSON.stringify(all));
          }
          if (d.theme === 'dark' || d.theme === 'light') localStorage.setItem('at.theme', d.theme);
          if (/^\d{1,6}$/.test(String(d.division || ''))) localStorage.setItem('at.division', String(Number(d.division)));
          if (d.installed) localStorage.setItem('at.installed', '1');
          var to = m[2] ? decodeURIComponent(m[2]) : '#/';
          history.replaceState(null, '', location.pathname + (/^#\/[\w\/-]*$/.test(to) ? to : '#/'));
        }
      } catch (e) { history.replaceState(null, '', location.pathname + '#/'); }
      try {
        var t = localStorage.getItem('at.theme') || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <style>
      html, body { margin: 0; background: #0a0a0a; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f3f6; }
      /* ---------- splash ---------- */
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #0a0a0a; transition: opacity .35s ease;
      }
      :root[data-theme='light'] #splash { background: #f2f3f6; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark { display: grid; justify-items: center; gap: 14px; animation: splash-in .5s ease both; }
      #splash img { width: 112px; height: 112px; object-fit: contain; }
      #splash .name { font: 700 15px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #8b8f94; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.92); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="mark">
        <img src="assets/alliance-logo.png" alt="" onerror="this.style.display='none'" />
        <div class="name">Alliance Tracker</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
